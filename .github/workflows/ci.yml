name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    name: Run Tests & Verification
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Run Unit Tests with Coverage
        run: go test -v -race -coverprofile=coverage.txt -covermode=atomic ./...

      - name: Run Static Analysis
        run: go vet ./...

      - name: Build Binary Verification
        run: CGO_ENABLED=0 go build -v -o pv-signal-radar ./cmd/server

      - name: Build Container Verification
        run: docker build --tag pv-signal-radar:ci .

      - name: Smoke Test Container Health Endpoint
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --rm --name pv-signal-radar-ci --publish 18080:8080 pv-signal-radar:ci
          trap 'docker rm --force pv-signal-radar-ci >/dev/null 2>&1 || true' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent --show-error http://127.0.0.1:18080/api/v1/health; then
              exit 0
            fi
            sleep 1
          done
          docker logs pv-signal-radar-ci
          exit 1
